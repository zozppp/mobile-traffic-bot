name: Bulk Mobile Traffic Bot

on:
  workflow_dispatch:

jobs:
  run-matrix:
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5] # قللنا العدد لـ 5 عشان السيرفر يلحق يفتح المتصفح
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Mobile Bot Script
        run: python main.py
        
